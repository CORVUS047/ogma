[package]
name = "ogma"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.18.2"
crossterm = "0.29.0"
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
lofty = "0.25.4"
rand = "0.10.3"
ratatui = "0.30.2"
rtrb = "0.4.0"
rubato = "5.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
symphonia = { version = "0.6.1", features = ["all"] }
symphonia-adapter-libopus = "0.3.0"
toml = "1.1.6"
ureq = "3.4.2"
